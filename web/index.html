<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Stratbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <nav class="nav" id="tabs" aria-label="Main">
    <div class="nav-brand" aria-hidden="true">SB</div>
    <a href="#/home" data-tab="home" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/maps" data-tab="maps" title="Maps and strats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 2.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg>Maps</a>
    <a href="#/ops" data-tab="ops" title="Operators">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3 2.4 3.5 5.2"/></svg>Operators</a>
    <a href="#/arsenal" data-tab="arsenal" title="Weapons and gadgets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Arsenal</a>
    <a href="#/stats" data-tab="stats" title="Strat stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
    <a href="#/progress" data-tab="progress" title="Your progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</a>
    <a href="#/sens" data-tab="sens" title="Sensitivity tracker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 2.5V9M6 9h12"/></svg>Sens</a>
    <div class="nav-spacer"></div>
    <button type="button" class="nav-btn" id="findBtn" title="Search everything (Ctrl+K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
    <button type="button" class="nav-btn" id="webBtn" title="Open a web search window">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></svg>Web</button>
    <a href="#/settings" data-tab="settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    <a href="#/profile" data-tab="profile" title="Your profile" id="navProfile">
      <span class="nav-avatar" id="navAvatar">?</span>Profile</a>
    <div class="save-state" id="saveState">Loading</div>
  </nav>
  <aside class="rail" aria-label="List">
    <div class="rail-scroll" id="rail"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" hidden>
<input type="file" id="imagesFile" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" multiple hidden>

<div class="finder" id="finder" hidden>
  <div class="finder-box">
    <input id="finderInput" type="text" placeholder="Search strats, operators, weapons, maps" autocomplete="off" spellcheck="false">
    <ol id="finderResults"></ol>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <form class="modal-box" id="modalForm">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <input class="in" id="modalInput" type="text" autocomplete="off" spellcheck="false">
    <div class="modal-btns">
      <button type="button" class="btn" id="modalCancel">Cancel</button>
      <button type="submit" class="btn primary" id="modalOk">OK</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="seed.js"></script>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="store.js"></script>
<script src="icons.js"></script>
<script src="board.js"></script>
<script src="app.js"></script>
</body>
</html>
