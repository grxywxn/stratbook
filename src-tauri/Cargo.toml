[package]
name = "stratbook"
version = "2.2.1"
description = "Stratbook: strats and operator guides for Rainbow Six Siege"
edition = "2021"

[lib]
name = "stratbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Downloads an image when a web link (not a file) is dropped on the app.
ureq = "2"

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
